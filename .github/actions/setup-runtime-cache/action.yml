name: Setup runtime wasm cache
description: Restore or build development runtime Wasm shared across runner operating systems

runs:
  using: composite
  steps:
    - name: Cache runtime wasm
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: crates/core/prebuilt
        key: runtime-wasm-v4-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'crates/runtime/**', 'crates/core/build.rs', 'crates/core/build/**', 'crates/core/wit/**', 'xtask/**') }}
        enableCrossOsArchive: true

    - name: Build runtime wasm
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: cargo run --locked -p xtask -- --output crates/core/prebuilt
