name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      checkout_ref:
        description: Revision validated by the release workflow
        required: true
        type: string
      validation_context:
        description: Release entry point used to distinguish concurrent validation
        required: true
        type: string
    secrets:
      BUILDBUDDY_API_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: buck2-${{ github.workflow }}-${{ inputs.validation_context || 'pull-request' }}-${{ inputs.checkout_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    name: Native Buck2 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    environment: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) && 'buildbuddy' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Install DotSlash
        uses: facebook/install-dotslash@1e4e7b3e07eaca387acb98f1d4720e0bee8dbb6a # v2

      - name: Install Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: "1.58.0"

      - name: Install Cargo and rustfmt for graph and formatting checks
        if: runner.os == 'Linux'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.99.0"
          components: rustfmt

      - name: Configure MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0
        with:
          arch: x64

      - name: Enable optional BuildBuddy cache
        shell: bash
        env:
          BUILDBUDDY_API_KEY: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) && secrets.BUILDBUDDY_API_KEY || '' }}
        run: |
          if [[ -n "$BUILDBUDDY_API_KEY" ]]; then
            cp .github/buildbuddy.buckconfig .buckconfig.local
            printf '\ninstance_name = componentize-qjs-%s-%s-%s-%s\n' \
              "$RUNNER_OS" "$RUNNER_ARCH" "$ImageOS" "${ImageVersion:?runner image version required}" \
              >> .buckconfig.local
            echo "BUILDBUDDY_API_KEY=$BUILDBUDDY_API_KEY" >> "$GITHUB_ENV"
            # The pinned prelude disables Rust uploads. This testing-only override
            # must be rechecked on Buck upgrades; see README's BuildBuddy section.
            echo "BUCK2_TEST_FORCE_CACHE_UPLOAD=1" >> "$GITHUB_ENV"
          fi

      - name: Check generated dependency graph
        if: runner.os == 'Linux'
        shell: bash
        run: just check-generated

      - name: Check Rust formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Build and test native targets
        shell: bash
        run: just test

      - name: Clippy
        shell: bash
        run: just clippy

      - name: Build release artifacts
        if: github.event_name != 'pull_request'
        shell: bash
        run: just release

      - name: Check release and sync-only runtimes
        if: runner.os == 'Linux'
        shell: bash
        run: just check-runtimes

      - name: Ensure builds preserve sources
        run: git diff --exit-code
