manifest_path = "third-party/Cargo.toml"
third_party_dir = "third-party"
vendor = false
precise_srcs = true
include_top_level = false
include_workspace_members = false
cargo_env = true
unresolved_fixup_error = true

[platform.linux-x86_64]
target = "x86_64-unknown-linux-gnu"
execution-platform = true

[platform.linux-arm64]
target = "aarch64-unknown-linux-gnu"
execution-platform = true

[platform.macos-x86_64]
target = "x86_64-apple-darwin"
execution-platform = true

[platform.macos-arm64]
target = "aarch64-apple-darwin"
execution-platform = true

[platform.windows-msvc]
target = "x86_64-pc-windows-msvc"
execution-platform = true

[platform.windows-gnu]
target = "x86_64-pc-windows-gnu"
execution-platform = true

[platform.wasi]
target = "wasm32-wasip2"
execution-platform = false

[buck]
alias = "cargo_alias"
rust_library = "cargo.rust_library"
rust_binary = "cargo.rust_binary"
http_archive = "crate_download"
buildscript_genrule = "buildscript_run"
buckfile_imports = """
load("@prelude//rust:cargo_package.bzl", "cargo", cargo_alias = "alias")
load("//third-party:defs.bzl", "buildscript_run", "crate_download")

export_file(
    name = "Cargo.lock",
    src = "Cargo.lock",
    visibility = ["PUBLIC"],
)
"""
